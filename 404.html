layout: default
title: 404 - Page not found
permalink: /404.html
---

<script>
  (function() {
    var path = window.location.pathname;
    var target = path;
    var changed = false;

    // 1. Intercepta requisições legadas do tipo /_posts/YYYY-MM-DD-slug.html
    if (target.indexOf('/_posts/') !== -1) {
      target = target.replace('/_posts/', '/').replace(/\.html$/, '');
      changed = true;
    }

    // 2. Intercepta posts gerados com a data do fuso antigo (2026-09-30) e redireciona para 2026-10-01
    if (target.indexOf('2026-09-30-') !== -1) {
      target = target.replace('2026-09-30-', '2026-10-01-');
      changed = true;
    }

    if (changed) {
      if (!target.endsWith('/')) target += '/';
      window.location.replace(target);
    }
  })();
</script>

<div class="text-center" style="padding: 3rem 1rem;">
  <h1 style="color: #FF7F50; font-family: 'Inter', sans-serif;">Página Não Encontrada (404)</h1>
  <p style="color: #94a3b8; font-size: 1.15rem;">O conteúdo solicitado foi movido ou o endereço digitado contém o prefixo interno <code>_posts/</code>.</p>
  <p style="margin-top: 1.5rem;">
    <a href="{{ '' | absolute_url }}" class="btn" style="background-color: #FF7F50; border: none; color: #0a1118; font-weight: 700; padding: 0.6rem 1.4rem; border-radius: 8px;">
      ← Voltar para a Página Inicial
    </a>
  </p>
  <br/>
  <img src="{{ 'assets/img/404-southpark.jpg' | relative_url }}" alt="Not found" style="border-radius: 12px; max-width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);" />
</div>
